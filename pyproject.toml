[project]
name = "kidtune"
version = "1.0.0"
description = "Kid-friendly music request portal for Plex & Plexamp with explicit safeguards and full metadata tagging."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tyler Burks" }]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/TBKarnage/KidTune"
Repository = "https://github.com/TBKarnage/KidTune"
Issues = "https://github.com/TBKarnage/KidTune/issues"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
